# Llama-3.1 70B BF16 pretrain with FSDP collectives routed onto the rocclr
# SDMA dispatch path (__amd_rocclr_batchMemOp / hsa_amd_memory_async_batch_copy).
#
# Differs from llama3.1_70B-BF16-pretrain.yaml only in:
#   1. primus_sdma.enable_symm_mem_collectives = true
#      -> wraps every fully_shard() call so the AG/RS comm uses
#         SymmMemAllGather / SymmMemReduceScatter (cuMem-backed buffers).
#         See primus/backends/torchtitan/patches/sdma_symm_mem_collectives.py
#         and the parent repo's README.md section (1b) for the verification
#         chain (rocprof: 192 batch_copy calls/8-ranks vs 0 without).
#   2. model.hf_assets_path points at a *local* directory that the runner
#      pre-stages from the public unsloth mirror
#      (unsloth/Meta-Llama-3.1-70B-Instruct) -- no HF_TOKEN required, since
#      meta-llama/Llama-3.1-70B is gated.
#
# Required outer environment (set by the runner):
#   NCCL_CTA_POLICY=2  NCCL_CUMEM_ENABLE=1
#   NCCL_LOCAL_REGISTER=0   (avoids the libamdhip64 hipMemRetainAllocationHandle SIGSEGV on this build)
#   TORCH_NCCL_USE_TENSOR_REGISTER_ALLOCATOR_HOOK=true
#   LD_PRELOAD=/path/to/libhip_attr_drain.so  (interposer for the unrelated cuDeviceGetAttribute TLS leak)

work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:llama3.1_70B-BF16-SDMA-pretrain}
workspace: ./output

modules:
  pre_trainer:
    framework: torchtitan
    config: pre_trainer.yaml

    # model to run
    model: llama3.1_70B.yaml
    overrides:
      sink_level: null
      file_sink_level: DEBUG
      stderr_sink_level: INFO

      lr_scheduler:
        warmup_steps: 10

      metrics:
        log_freq: 1

      training:
        # Aligned with Primus default llama3.1_70B-BF16-pretrain.yaml for MI300X
        # (local_batch_size: 2, seq_len: 8192). Production-shaped workload so
        # the SDMA/comm-vs-compute ratio matches what real pretraining sees.
        local_batch_size: 2
        seq_len: 8192
        mock_data: true            # smoke: no HF dataset needed; tokenizer files only
        steps: 5
        gc_freq: 100

      optimizer:
        lr: 1.5e-4

      activation_checkpoint:
        mode: full

      # Override the gated meta-llama path with the local dir the runner
      # stages from the public unsloth mirror. Override resolved by
      # primus.modules.trainer.torchtitan.pre_trainer's extra-args merge.
      model:
        hf_assets_path: ${PRIMUS_HF_ASSETS_PATH:/workspace/llama3_70b_assets}
        # Drop the primus_turbo converter; for SDMA bring-up we want a
        # vanilla torchtitan model so the only Primus-side wiring is our
        # sdma_symm_mem_collectives patch.
        converters: []

      # Profile mid-run so we can compare the AG breakdown vs the
      # no-SDMA baseline. profile_freq must be >= warmup + active (default
      # 3 + 1 = 4) -- we use 5 so step 5 captures a steady-state iter.
      profiling:
        enable_profiling: true
        profile_freq: 5
        save_traces_folder: profile_traces

      primus_turbo:
        enable_primus_turbo: false        # keep stack minimal for SDMA bring-up
        enable_attention_float8: false

      # >>> The actual SDMA enabler <<<
      primus_sdma:
        enable_symm_mem_collectives: true
        symm_mem_backend: NCCL
        log_per_module_attach: false
