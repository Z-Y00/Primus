# Llama-3.1 8B BF16 pretrain with the SDMA-via-symm_mem patch enabled.
# Fast smoke target for verifying the FSDP-SDMA wiring before scaling to 70B.
# See companion file llama3.1_70B-BF16-SDMA-pretrain.yaml and
# primus/backends/torchtitan/patches/sdma_symm_mem_collectives.py.

work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:llama3.1_8B-BF16-SDMA-pretrain}
workspace: ./output

modules:
  pre_trainer:
    framework: torchtitan
    config: pre_trainer.yaml

    model: llama3.1_8B.yaml
    overrides:
      sink_level: null
      file_sink_level: DEBUG
      stderr_sink_level: INFO

      metrics:
        log_freq: 1
        enable_wandb: false

      lr_scheduler:
        warmup_steps: 10

      training:
        local_batch_size: 1
        seq_len: 2048
        mock_data: true                  # smoke: no HF dataset needed
        steps: 5
        gc_freq: 100

      activation_checkpoint:
        mode: "full"

      model:
        hf_assets_path: ${PRIMUS_HF_ASSETS_PATH:/workspace/llama3_8b_assets}
        # Drop the primus_turbo converter; for SDMA bring-up we want a
        # vanilla torchtitan model so the only Primus-side wiring is our
        # sdma_symm_mem_collectives patch.
        converters: []

      primus_turbo:
        enable_primus_turbo: false
        enable_attention_float8: false

      primus_sdma:
        enable_symm_mem_collectives: true
        log_per_module_attach: true      # noisy but useful for smoke verification
